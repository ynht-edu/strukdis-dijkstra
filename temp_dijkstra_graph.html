        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#2ECC71", "id": "1", "label": "1\n(D: 0)", "physics": false, "shape": "dot", "title": "1\n(D: 0)", "x": 60.855923105122876, "y": -456.34380703195137}, {"color": "#2ECC71", "id": "2", "label": "2\n(D: 2.0)", "physics": false, "shape": "dot", "title": "2\n(D: 2.0)", "x": 110.45008754508, "y": -85.4507852091651}, {"color": "#2ECC71", "id": "3", "label": "3\n(D: 3.0)", "physics": false, "shape": "dot", "title": "3\n(D: 3.0)", "x": -117.65213807050068, "y": -281.49876548726627}, {"color": "#2ECC71", "id": "4", "label": "4\n(D: 4.0)", "physics": false, "shape": "dot", "title": "4\n(D: 4.0)", "x": 63.22117975453234, "y": 298.5698153719324}, {"color": "#2ECC71", "id": "5", "label": "5\n(D: 6.0)", "physics": false, "shape": "dot", "title": "5\n(D: 6.0)", "x": -70.69763505310108, "y": 24.723542356450157}, {"color": "#2ECC71", "id": "6", "label": "6\n(D: 7.0)", "physics": false, "shape": "dot", "title": "6\n(D: 7.0)", "x": -46.17741728113366, "y": 500.0}]);
                  edges = new vis.DataSet([{"from": "1", "label": "2.0", "to": "2"}, {"from": "1", "label": "4.0", "to": "3"}, {"from": "2", "label": "1.0", "to": "3"}, {"from": "2", "label": "2.0", "to": "4"}, {"from": "2", "label": "6.0", "to": "5"}, {"from": "3", "label": "4.0", "to": "5"}, {"from": "4", "label": "2.0", "to": "5"}, {"from": "4", "label": "5.0", "to": "6"}, {"from": "5", "label": "1.0", "to": "6"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": false,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
